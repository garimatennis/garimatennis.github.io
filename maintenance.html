<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Garima Kalugade | Back soon</title>
<style>
:root{--ball:#dcff3a}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(120% 90% at 80% 10%,#1f4fa8 0,#0e2458 45%,#0b1a33 100%);color:#f7f9ff;font-family:"Segoe UI",system-ui,sans-serif}
.bar{position:fixed;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#0091d2 0 25%,#c8552b 25% 50%,#00693e 50% 62.5%,#4f2d7f 62.5% 75%,#1b3f94 75%)}
.ball{width:46px;height:46px;border-radius:50%;margin:0 auto 26px;background:radial-gradient(circle at 35% 30%,#f6ffb0,var(--ball) 55%,#a9c800);animation:b 1.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes b{50%{transform:translateY(-40px)}}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,5vw,2.8rem);margin-bottom:12px}
p{color:#c3d1e8;font-size:1.1rem}
@media(prefers-reduced-motion:reduce){.ball{animation:none}}
</style>
</head>
<body>
<div class="bar"></div>
<main>
<div class="ball" aria-hidden="true"></div>
<h1>Site temporarily down for maintenance</h1>
<p>We'll be back online shortly!</p>
</main>
</body>
</html>
